spring.application.name=loginguard

# Database: no default password, it comes from the environment only
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/loginguard}
spring.datasource.username=${DB_USER:loginguard}
spring.datasource.password=${DB_PASSWORD:}
# The schema is owned by Flyway migrations; Hibernate only checks that the entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.web.pageable.max-page-size=100

# Errors: RFC 9457 problem details, never a stack trace or an exception message
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Session cookie of the single-page app (same origin): not readable by JavaScript, never sent
# by cross-site requests, HTTPS only unless explicitly disabled for local HTTP development
server.servlet.session.cookie.name=LG_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# First administrator, created only when no operator exists yet (at least 12 characters)
loginguard.admin.password=${LOGINGUARD_ADMIN_PASSWORD:}
# Brute force protection of the operators' own login
loginguard.security.max-failed-logins=5
loginguard.security.lockout-duration=15m
loginguard.security.login-attempts-per-minute=${LOGIN_RATE_LIMIT_PER_MINUTE:10}
